name: npm publish

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/nudge-runtime-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Build package (compile the single TS runtime to js + d.ts)
        run: |
          cd runtime/npm
          npm install --no-save typescript@5
          npx tsc ../nudge_runtime.ts --outDir . --target es2022 --module nodenext --moduleResolution nodenext --declaration --skipLibCheck
      - name: Smoke: package loads and exposes the API
        run: node -e "import('./runtime/npm/nudge_runtime.js').then(m => { if (!m.llmCall || !m.decide || !m.predictBatch || !m.forAll) process.exit(1); })"
      - name: Publish
        run: npm publish runtime/npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
