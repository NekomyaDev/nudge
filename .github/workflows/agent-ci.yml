# Dogfood: run the nudge-ci action against our own example agents on every
# push/PR that touches them. Zero tokens — replays recorded traces.
name: agent-ci

on:
  push:
    branches: [main]
    paths: ["examples/**", "action.yml", ".github/workflows/agent-ci.yml"]
  pull_request:
    paths: ["examples/**", "action.yml", ".github/workflows/agent-ci.yml"]
  workflow_dispatch:

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nudgec from source (main tracks main)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cargo
          cargo install --path crates/nudgec --locked
      - name: Replay-test every example agent
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: |
          status=0
          for f in examples/*/*.ndg; do
            echo "::group::nudgec test $f"
            (cd "$(dirname "$f")" && nudgec test "$(basename "$f")") || status=1
            echo "::endgroup::"
          done
          exit $status
