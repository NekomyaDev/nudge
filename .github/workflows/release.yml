name: release

# Tag-driven release pipeline (v1.2): `git tag v1.2.1 && git push --tags`
# Builds stripped prebuilt nudgec binaries for linux/mac/windows and attaches
# them to the GitHub Release. Binaries are stripped of debug symbols to
# deter reverse engineering. crates.io / PyPI publishing stays OFF until
# the owner enables it: set repo variables CARGO_PUBLISH_ENABLED=true /
# PYPI_PUBLISH_ENABLED=true plus the CARGO_REGISTRY_TOKEN / PYPI_API_TOKEN
# secrets. VS Code Marketplace publish is gated the same way:
# VSCODE_PUBLISH_ENABLED=true plus the VSCE_PAT secret.
#
# NOTE: The resulting binaries are proprietary. The MIT license in this
# repository applies to the source code only; distributed binaries are
# subject to the separate LICENSE-BINARY terms.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, bin: nudgec-linux-x86_64 }
          - { target: x86_64-apple-darwin, os: macos-latest, bin: nudgec-macos-x86_64 }
          - { target: aarch64-apple-darwin, os: macos-latest, bin: nudgec-macos-aarch64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: nudgec-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: strip debug symbols
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nudgec"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Windows: llvm-strip via llvm-tools or fallback to no-op
            rustup component add llvm-tools-preview 2>/dev/null || true
            STRIP="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-strip.exe"
            if [ -f "$STRIP" ]; then
              "$STRIP" "$BIN" || true
            else
              echo "llvm-strip not found, skipping strip on Windows"
            fi
          else
            strip "$BIN" || true
          fi

      - name: stage the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nudgec"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          mkdir -p stage
          cp "$BIN" "stage/${{ matrix.bin }}"
          ls -la stage
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: stage/

  attach:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - run: |
          TAG="${GITHUB_REF_NAME}"
          chmod +x nudgec-* || true
          for f in nudgec-*; do
            case "$f" in
              *.exe)
                name="${f%.exe}"
                platform="${name#nudgec-}"
                mv "$f" "nudgec.exe"
                zip -q "nudgec-${TAG}-${platform}.zip" "nudgec.exe"
                rm "nudgec.exe"
                ;;
              *)
                platform="${f#nudgec-}"
                mv "$f" "nudgec"
                tar czf "nudgec-${TAG}-${platform}.tar.gz" "nudgec"
                rm "nudgec"
                ;;
            esac
          done
          ls -la *.tar.gz *.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nudgec-*.tar.gz
            nudgec-*.zip
          generate_release_notes: true

  crates:
    if: ${{ vars.CARGO_PUBLISH_ENABLED == 'true' }}
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  pypi:
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build twine
          cd runtime && python -m build
      - run: twine upload runtime/dist/* -u __token__ -p "${{ secrets.PYPI_API_TOKEN }}" --non-interactive

  vscode:
    if: ${{ vars.VSCODE_PUBLISH_ENABLED == 'true' }}
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @vscode/vsce
      - name: install extension deps (if any)
        working-directory: editors/vscode
        run: npm ci --ignore-scripts || true
      - name: publish to the Marketplace
        working-directory: editors/vscode
        run: vsce publish --pat "${{ secrets.VSCE_PAT }}"
