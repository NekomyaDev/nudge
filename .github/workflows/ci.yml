name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # e2e tests drive the generated code through real interpreters
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the compiler test suite
        run: cargo test --workspace
      - name: Run the TS runtime tests
        run: node --experimental-strip-types --test runtime/nudge_runtime.test.mjs
      - name: Run the Python runtime + bridge tests
        run: |
          python3 -m unittest runtime.test_nudge_runtime -v
          python3 bridges/test_bridges.py

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt gate
        run: cargo fmt --all -- --check
      - name: clippy gate (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  offline-replay-gate:
    name: offline replay gate ($0 CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build nudgec
        run: cargo build -p nudgec
      - name: Run offline replay regression gate
        run: bash scripts/offline_replay_gate.sh

  wasm-host-e2e:
    name: wasm live-tool host bridge e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the wasm32-wasip1 target
        run: rustup target add wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the WASM live-tool host bridge e2e
        run: bash scripts/wasm_host_e2e.sh

  gui-acceptance:
    name: native GUI desktop acceptance (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install Xvfb + X11 build/runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 libgl1-mesa-dev
      - name: Run the real native-window acceptance test under a virtual display
        # Builds the window runtime behind `native-gui` and drives a REAL OS window:
        # create window -> dispatch click -> agent state changes -> re-render.
        run: bash scripts/gui_acceptance.sh

