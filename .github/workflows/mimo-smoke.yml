name: MiMo smoke

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: live MiMo run + trace viewer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the compiler
        run: cargo build --release --workspace
      - name: Write the smoke program
        run: |
          mkdir -p smoke traces
          cat > smoke/mimo_smoke.ndg <<'NDG'
          type Brief = { summary: string, keywords: [string], reading_time_min: float }

          fn summarize(topic: string) -> Brief uses LLM {
              llm"""Summarize {topic} in one sentence, then give 3 keywords and an estimated reading time in minutes. Return the summary, keywords and reading_time_min."""
              with { schema: Brief, model: "mimo:mimo-v2.5", budget: 0.02 USD, retry: 1 with repair }
          }

          fn main() -> Brief uses LLM {
              let a = summarize("urban heat islands")
              let b = summarize("green roofs")
              llm"""Combine these two briefs into one: {a} and {b}. Return summary, keywords and reading_time_min."""
              with { schema: Brief, model: "mimo:mimo-v2.5", budget: 0.02 USD, retry: 1 with repair }
          }
          NDG
      - name: Compile (check + emit Python)
        run: |
          ./target/release/nudgec check smoke/mimo_smoke.ndg
          ./target/release/nudgec build smoke/mimo_smoke.ndg
      - name: Live run against MiMo
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          NUDGE_PROVIDER: mimo
          NUDGE_TRACE: traces/mimo_run.jsonl
          NUDGE_BUDGET: "0.05"
          PYTHONPATH: runtime
        run: python3 out/mimo_smoke.py
      - name: Validate the trace (frozen v1 schema)
        run: ./target/release/nudgec trace-check traces/mimo_run.jsonl
      - name: Trace viewer smoke check
        run: |
          ./target/release/nudgec trace-view traces/mimo_run.jsonl --no-open --port 8321 &
          sleep 1
          curl -fsS http://127.0.0.1:8321/ | grep -q "Nudge Trace Viewer"
          curl -fsS http://127.0.0.1:8321/trace | grep -q '"kind": "llm.call"'
          kill %1
      - name: Trace diff demo (live trace vs committed demo trace)
        run: |
          ./target/release/nudgec trace-diff traces/mimo_run.jsonl traces/mimo_run.jsonl
          ./target/release/nudgec trace-diff examples/traces/demo_run.jsonl traces/mimo_run.jsonl
      - name: Write the par smoke program (NTF v1.1 branch lanes)
        run: |
          cat > smoke/mimo_par_smoke.ndg <<'NDG'
          type Brief = { summary: string, keywords: [string], reading_time_min: float }

          fn summarize(topic: string) -> Brief uses LLM {
              llm"""Summarize {topic} in one sentence, then give 3 keywords and an estimated reading time in minutes. Return the summary, keywords and reading_time_min."""
              with { schema: Brief, model: "mimo:mimo-v2.5", budget: 0.02 USD, retry: 1 with repair }
          }

          fn main() -> [Brief] uses LLM {
              let topics = ["urban heat islands", "green roofs", "sponge cities"]
              par map topics |t| -> summarize(t)
          }
          NDG
      - name: Compile the par smoke program
        run: |
          ./target/release/nudgec check smoke/mimo_par_smoke.ndg
          ./target/release/nudgec build smoke/mimo_par_smoke.ndg
      - name: Live par run against MiMo (branch lanes)
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          NUDGE_PROVIDER: mimo
          NUDGE_TRACE: traces/mimo_par.jsonl
          NUDGE_BUDGET: "0.06"
          PYTHONPATH: runtime
        run: python3 out/mimo_par_smoke.py
      - name: Validate the par trace (branch fields present, frozen v1 OK)
        run: |
          ./target/release/nudgec trace-check traces/mimo_par.jsonl
          grep -q '"branch": "par\[0\]"' traces/mimo_par.jsonl
          grep -q '"branch": "par\[1\]"' traces/mimo_par.jsonl
          grep -q '"branch": "par\[2\]"' traces/mimo_par.jsonl
      - name: Trace viewer smoke check (par trace)
        run: |
          ./target/release/nudgec trace-view traces/mimo_par.jsonl --no-open --port 8322 &
          sleep 1
          curl -fsS http://127.0.0.1:8322/trace | grep -q '"branch"'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: mimo-trace
          path: |
            traces/mimo_run.jsonl
            traces/mimo_par.jsonl
