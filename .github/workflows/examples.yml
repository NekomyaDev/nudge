name: examples

on:
  push:
    branches: [main]
    paths: ["examples/**", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", ".github/workflows/examples.yml"]

env:
  # The Python runtime (nudge_runtime) ships inside the published image,
  # so check/build/test all run there.
  NUDGE_IMAGE: nekomyadev/nudge:1.2.0

jobs:
  check-build-test:
    name: check / build / test (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [chatbot, code-reviewer, data-analyzer, research-agent, translator]
    steps:
      - uses: actions/checkout@v7

      - name: Pull nudge image
        run: docker pull "$NUDGE_IMAGE"

      - name: nudgec check / build / test (fake provider, no API key)
        working-directory: examples/${{ matrix.example }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w "/workspace" -e NUDGE_PROVIDER=fake "$NUDGE_IMAGE" \
            sh -c "nudgec check ${{ matrix.example }}.ndg && nudgec build ${{ matrix.example }}.ndg && nudgec test ${{ matrix.example }}.ndg"
