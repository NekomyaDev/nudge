[package]
name = "nudge-agent"
version = "0.1.0"
description = "Minimal runtime binary for standalone Nudge agent executables"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nudge-agent"
path = "src/main.rs"

[[bin]]
name = "nudge-replay-wasi"
path = "src/bin/replay_wasi.rs"

[features]
default = ["live-provider"]
live-provider = ["nudge-runtime/live-provider"]

[dependencies]
nudge-runtime = { path = "../nudge-runtime", default-features = false }
nudgec = { path = "../nudgec", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
