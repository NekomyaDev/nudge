[package]
name = "nudge-agent"
version = "0.1.0"
description = "Minimal runtime binary for standalone Nudge agent executables"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nudge-agent"
path = "src/main.rs"

[dependencies]
nudge-runtime = { path = "../nudge-runtime" }
nudgec = { path = "../nudgec", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
