<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Trace Viewer</title>
<style>
  :root {
    --bg: #0d0b16; --panel: #161226; --panel2: #1d1832; --line: #2c2450;
    --fg: #e8e4f5; --dim: #9a90c0; --violet: #8b5cf6; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--violet); }
  header .file { color: var(--dim); font-size: 12px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--dim); font-size: 11px; }
  .toolbar { padding: 10px 20px; display: flex; gap: 8px; align-items: center;
             border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .fbtn { background: var(--panel); color: var(--dim); border: 1px solid var(--line);
          border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .fbtn.on { background: var(--violet); color: #fff; border-color: var(--violet); }
  #search { background: var(--panel); border: 1px solid var(--line); color: var(--fg);
            border-radius: 6px; padding: 5px 10px; font-size: 12px; width: 220px; }
  main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 108px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); }
  .rec { padding: 8px 20px; border-bottom: 1px solid var(--line); cursor: pointer;
         display: flex; gap: 10px; align-items: baseline; }
  .rec:hover { background: var(--panel); }
  .rec.sel { background: var(--panel2); border-left: 3px solid var(--violet); padding-left: 17px; }
  .seq { color: var(--dim); font-size: 11px; min-width: 32px; }
  .kind { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
          text-transform: uppercase; letter-spacing: .5px; }
  .kind-llm { background: #31235e; color: #c4b0ff; }
  .kind-tool { background: #123f33; color: var(--green); }
  .kind-fn { background: #1e2a4a; color: var(--blue); }
  .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); font-size: 11px; }
  .ok { color: var(--green); } .repair { color: var(--amber); } .fail { color: var(--red); }
  #detail { overflow-y: auto; padding: 16px 20px; background: var(--panel); }
  #detail h2 { font-size: 13px; color: var(--dim); margin: 0 0 10px; }
  #detail pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                padding: 14px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  #detail .kv { margin: 6px 0; } #detail .kv b { color: var(--violet); }
  .branch { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .lane { border-left: 3px solid transparent; }
  .empty { color: var(--dim); padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>&#9679; Nudge Trace Viewer</h1>
  <span class="file" id="file"></span>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <button class="fbtn on" data-k="all">All</button>
  <button class="fbtn" data-k="llm.call">LLM calls</button>
  <button class="fbtn" data-k="tool.call">Tool calls</button>
  <button class="fbtn" data-k="fn.return">fn.return</button>
  <button class="fbtn" data-k="repair">repairs only</button>
  <input id="search" placeholder="filter text&hellip;">
</div>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a record to inspect it.</div></div>
</main>
<script>
let recs = [], filter = "all", q = "", sel = -1;

fetch("/trace").then(r => r.text()).then(t => {
  recs = t.split("\n").filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  document.getElementById("file").textContent = location.pathname === "/" ? (window.__FILE__ || "") : "";
  renderStats(); renderList(); if (sel >= 0) renderDetail();
});

function money(x) { return "$" + Number(x).toFixed(4); }
const BRANCH_COLORS = ["#8b5cf6","#34d399","#fbbf24","#60a5fa","#f87171","#f472b6","#22d3ee","#a3e635"];
function branchColor(b) {
  let h = 0; for (const c of b) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return BRANCH_COLORS[h % BRANCH_COLORS.length];
}
function branchBadge(r) {
  if (!r.branch) return "";
  const c = branchColor(r.branch);
  return `<span class="branch" style="background:${c}22;color:${c}">${esc(r.branch)}</span>`;
}
// XSS fix: escape helper and DOM construction to prevent DOM-based XSS
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}
function esc(s) { return escapeHtml(s); }

function renderStats() {
  const llm = recs.filter(r => r.kind === "llm.call");
  const tool = recs.filter(r => r.kind === "tool.call");
  const tin = llm.reduce((a, r) => a + (r.tokens && r.tokens.in || 0), 0);
  const tout = llm.reduce((a, r) => a + (r.tokens && r.tokens.out || 0), 0);
  const cost = llm.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const repairs = llm.filter(r => r.repair_round > 0).length;
  const statsEl = document.getElementById("stats");
  statsEl.textContent = "";
  const items = [
    [recs.length, "records"], [llm.length, "llm calls"], [tool.length, "tool calls"],
    [tin + tout, "tokens (" + tin + " in / " + tout + " out)"],
    [money(cost), "total cost"], [repairs, "repairs"]
  ];
  for (const [b, s] of items) {
    const div = document.createElement("div");
    div.className = "stat";
    const bold = document.createElement("b");
    bold.textContent = b;
    const span = document.createElement("span");
    span.textContent = s;
    div.appendChild(bold);
    div.appendChild(span);
    statsEl.appendChild(div);
  }
}

function who(r) {
  if (r.kind === "llm.call") return (r.model || "") + "  ·  " + (r.provider || "");
  if (r.kind === "tool.call") return (r.tool || "") + (r.server ? "  ·  " + r.server : "");
  return (r.fn || "") + "()";
}
function branchBadgeEl(r) {
  if (!r.branch) return null;
  const c = branchColor(r.branch);
  const span = document.createElement("span");
  span.className = "branch";
  span.style.background = c + "22";
  span.style.color = c;
  span.textContent = r.branch;
  return span;
}
function renderMeta(metaEl, r) {
  metaEl.textContent = "";
  if (r.kind === "llm.call") {
    const t = r.tokens || {};
    const cls = r.outcome === "ok" ? "ok" : (r.repair_round > 0 ? "repair" : "fail");
    metaEl.appendChild(document.createTextNode(`${t.in || 0}+${t.out || 0} tok · ${money(r.cost_usd || 0)} · `));
    const outcomeSpan = document.createElement("span");
    outcomeSpan.className = cls;
    outcomeSpan.textContent = r.outcome || "";
    metaEl.appendChild(outcomeSpan);
    if (r.repair_round > 0) {
      metaEl.appendChild(document.createTextNode(" · "));
      const repairSpan = document.createElement("span");
      repairSpan.className = "repair";
      repairSpan.textContent = `repair #${r.repair_round}`;
      metaEl.appendChild(repairSpan);
    }
    return;
  }
  const out = JSON.stringify(r.output);
  metaEl.textContent = (out && out.length > 60 ? out.slice(0, 60) + "…" : out || "");
}
function meta(r) {
  if (r.kind === "llm.call") {
    const t = r.tokens || {};
    const cls = r.outcome === "ok" ? "ok" : (r.repair_round > 0 ? "repair" : "fail");
    const rr = r.repair_round > 0 ? ` · <span class="repair">repair #${escapeHtml(r.repair_round)}</span>` : "";
    return `${escapeHtml(t.in||0)}+${escapeHtml(t.out||0)} tok · ${escapeHtml(money(r.cost_usd||0))} · <span class="${escapeHtml(cls)}">${escapeHtml(r.outcome||"")}</span>${rr}`;
  }
  if (r.kind === "tool.call") {
    const out = JSON.stringify(r.output);
    return escapeHtml(out && out.length > 60 ? out.slice(0, 60) + "…" : out || "");
  }
  const out = JSON.stringify(r.output);
  return escapeHtml(out && out.length > 60 ? out.slice(0, 60) + "…" : out || "");
}
function matches(r) {
  if (filter === "repair" && !(r.kind === "llm.call" && r.repair_round > 0)) return false;
  if (filter !== "all" && filter !== "repair" && r.kind !== filter) return false;
  if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
  return true;
}
function renderList() {
  const el = document.getElementById("list");
  const vis = recs.map((r, i) => [r, i]).filter(([r]) => matches(r));
  el.textContent = "";
  if (!vis.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No records match.";
    el.appendChild(empty);
    return;
  }
  for (const [r, i] of vis) {
    const recDiv = document.createElement("div");
    recDiv.className = `rec lane${i === sel ? " sel" : ""}`;
    recDiv.dataset.i = i;
    if (r.branch) {
      recDiv.style.borderLeftColor = branchColor(r.branch);
    }

    const seqSpan = document.createElement("span");
    seqSpan.className = "seq";
    seqSpan.textContent = `#${r.seq ?? i + 1}`;
    recDiv.appendChild(seqSpan);

    const kindSpan = document.createElement("span");
    const kindPrefix = typeof r.kind === "string" ? r.kind.split(".")[0] : "";
    kindSpan.className = `kind kind-${kindPrefix}`;
    kindSpan.textContent = r.kind || "";
    recDiv.appendChild(kindSpan);

    const badge = branchBadgeEl(r);
    if (badge) {
      recDiv.appendChild(badge);
    }

    const whoSpan = document.createElement("span");
    whoSpan.className = "who";
    whoSpan.textContent = who(r);
    recDiv.appendChild(whoSpan);

    const metaSpan = document.createElement("span");
    metaSpan.className = "meta";
    renderMeta(metaSpan, r);
    recDiv.appendChild(metaSpan);

    recDiv.onclick = () => {
      sel = i;
      renderList();
      renderDetail();
    };

    el.appendChild(recDiv);
  }
}
function renderDetail() {
  const r = recs[sel];
  const el = document.getElementById("detail");
  el.textContent = "";
  if (!r) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Select a record to inspect it.";
    el.appendChild(empty);
    return;
  }

  const h2 = document.createElement("h2");
  h2.textContent = `${r.kind || ""} · seq #${r.seq ?? ""}`;
  el.appendChild(h2);

  function createKv(boldLabel, textContent) {
    const kv = document.createElement("div");
    kv.className = "kv";
    const b = document.createElement("b");
    b.textContent = boldLabel;
    kv.appendChild(b);
    if (textContent !== undefined) {
      kv.appendChild(document.createTextNode(" " + textContent));
    }
    return kv;
  }

  function createPre(content) {
    const pre = document.createElement("pre");
    pre.textContent = typeof content === "string" ? content : JSON.stringify(content, null, 2);
    return pre;
  }

  if (r.kind === "llm.call") {
    const kv1 = document.createElement("div");
    kv1.className = "kv";
    const bModel = document.createElement("b");
    bModel.textContent = "model";
    kv1.appendChild(bModel);
    kv1.appendChild(document.createTextNode(` ${r.model || ""} · `));
    const bProvider = document.createElement("b");
    bProvider.textContent = "provider";
    kv1.appendChild(bProvider);
    kv1.appendChild(document.createTextNode(` ${r.provider || ""}`));
    el.appendChild(kv1);

    const kv2 = document.createElement("div");
    kv2.className = "kv";
    const bOutcome = document.createElement("b");
    bOutcome.textContent = "outcome";
    kv2.appendChild(bOutcome);
    kv2.appendChild(document.createTextNode(` ${r.outcome || ""} · `));
    const bRepair = document.createElement("b");
    bRepair.textContent = "repair_round";
    kv2.appendChild(bRepair);
    kv2.appendChild(document.createTextNode(` ${r.repair_round || 0} · `));
    const bCost = document.createElement("b");
    bCost.textContent = "cost";
    kv2.appendChild(bCost);
    kv2.appendChild(document.createTextNode(` ${money(r.cost_usd || 0)} · `));
    const bTokens = document.createElement("b");
    bTokens.textContent = "tokens";
    kv2.appendChild(bTokens);
    const tin = (r.tokens && r.tokens.in) || 0;
    const tout = (r.tokens && r.tokens.out) || 0;
    kv2.appendChild(document.createTextNode(` ${tin} in / ${tout} out`));
    el.appendChild(kv2);

    el.appendChild(createKv("input"));
    el.appendChild(createPre(r.input));
    el.appendChild(createKv("output"));
    el.appendChild(createPre(r.output));
  } else {
    el.appendChild(createKv("input"));
    el.appendChild(createPre(r.input));
    el.appendChild(createKv("output"));
    el.appendChild(createPre(r.output));
  }

  const rawKv = createKv("raw record");
  rawKv.style.marginTop = "14px";
  el.appendChild(rawKv);
  el.appendChild(createPre(r));
}
document.querySelectorAll(".fbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".fbtn").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.k; renderList();
});
document.getElementById("search").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const vis = recs.map((r, i) => [r, i]).filter(([r]) => matches(r));
  if (!vis.length) return;
  const pos = vis.findIndex(([, i]) => i === sel);
  if (e.key === "j" || e.key === "ArrowDown") { sel = vis[Math.min(pos + 1, vis.length - 1)][1]; renderList(); renderDetail(); }
  if (e.key === "k" || e.key === "ArrowUp") { sel = vis[Math.max(pos - 1, 0)][1]; renderList(); renderDetail(); }
});
</script>
</body>
</html>
