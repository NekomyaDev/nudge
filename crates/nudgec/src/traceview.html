<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Trace Viewer</title>
<style>
  :root {
    --bg: #0d0b16; --panel: #161226; --panel2: #1d1832; --line: #2c2450;
    --fg: #e8e4f5; --dim: #9a90c0; --violet: #8b5cf6; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--violet); }
  header .file { color: var(--dim); font-size: 12px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--dim); font-size: 11px; }
  .toolbar { padding: 10px 20px; display: flex; gap: 8px; align-items: center;
             border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .fbtn { background: var(--panel); color: var(--dim); border: 1px solid var(--line);
          border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .fbtn.on { background: var(--violet); color: #fff; border-color: var(--violet); }
  #search { background: var(--panel); border: 1px solid var(--line); color: var(--fg);
            border-radius: 6px; padding: 5px 10px; font-size: 12px; width: 220px; }
  main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 108px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); }
  .rec { padding: 8px 20px; border-bottom: 1px solid var(--line); cursor: pointer;
         display: flex; gap: 10px; align-items: baseline; }
  .rec:hover { background: var(--panel); }
  .rec.sel { background: var(--panel2); border-left: 3px solid var(--violet); padding-left: 17px; }
  .seq { color: var(--dim); font-size: 11px; min-width: 32px; }
  .kind { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
          text-transform: uppercase; letter-spacing: .5px; }
  .kind-llm { background: #31235e; color: #c4b0ff; }
  .kind-tool { background: #123f33; color: var(--green); }
  .kind-fn { background: #1e2a4a; color: var(--blue); }
  .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); font-size: 11px; }
  .ok { color: var(--green); } .repair { color: var(--amber); } .fail { color: var(--red); }
  #detail { overflow-y: auto; padding: 16px 20px; background: var(--panel); }
  #detail h2 { font-size: 13px; color: var(--dim); margin: 0 0 10px; }
  #detail pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                padding: 14px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  #detail .kv { margin: 6px 0; } #detail .kv b { color: var(--violet); }
  .empty { color: var(--dim); padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>&#9679; Nudge Trace Viewer</h1>
  <span class="file" id="file"></span>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <button class="fbtn on" data-k="all">All</button>
  <button class="fbtn" data-k="llm.call">LLM calls</button>
  <button class="fbtn" data-k="tool.call">Tool calls</button>
  <button class="fbtn" data-k="fn.return">fn.return</button>
  <button class="fbtn" data-k="repair">repairs only</button>
  <input id="search" placeholder="filter text&hellip;">
</div>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a record to inspect it.</div></div>
</main>
<script>
let recs = [], filter = "all", q = "", sel = -1;

fetch("/trace").then(r => r.text()).then(t => {
  recs = t.split("\n").filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  document.getElementById("file").textContent = location.pathname === "/" ? (window.__FILE__ || "") : "";
  renderStats(); renderList();
});

function money(x) { return "$" + Number(x).toFixed(4); }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderStats() {
  const llm = recs.filter(r => r.kind === "llm.call");
  const tool = recs.filter(r => r.kind === "tool.call");
  const tin = llm.reduce((a, r) => a + (r.tokens && r.tokens.in || 0), 0);
  const tout = llm.reduce((a, r) => a + (r.tokens && r.tokens.out || 0), 0);
  const cost = llm.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const repairs = llm.filter(r => r.repair_round > 0).length;
  document.getElementById("stats").innerHTML = [
    [recs.length, "records"], [llm.length, "llm calls"], [tool.length, "tool calls"],
    [tin + tout, "tokens (" + tin + " in / " + tout + " out)"],
    [money(cost), "total cost"], [repairs, "repairs"]
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
}

function who(r) {
  if (r.kind === "llm.call") return r.model + "  ·  " + (r.provider || "");
  if (r.kind === "tool.call") return r.tool + (r.server ? "  ·  " + r.server : "");
  return r.fn + "()";
}
function meta(r) {
  if (r.kind === "llm.call") {
    const t = r.tokens || {};
    const cls = r.outcome === "ok" ? "ok" : (r.repair_round > 0 ? "repair" : "fail");
    const rr = r.repair_round > 0 ? ` · <span class="repair">repair #${r.repair_round}</span>` : "";
    return `${t.in||0}+${t.out||0} tok · ${money(r.cost_usd||0)} · <span class="${cls}">${esc(r.outcome||"")}</span>${rr}`;
  }
  if (r.kind === "tool.call") {
    const out = JSON.stringify(r.output);
    return esc(out && out.length > 60 ? out.slice(0, 60) + "…" : out || "");
  }
  const out = JSON.stringify(r.output);
  return esc(out && out.length > 60 ? out.slice(0, 60) + "…" : out || "");
}
function matches(r) {
  if (filter === "repair" && !(r.kind === "llm.call" && r.repair_round > 0)) return false;
  if (filter !== "all" && filter !== "repair" && r.kind !== filter) return false;
  if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
  return true;
}
function renderList() {
  const el = document.getElementById("list");
  const vis = recs.map((r, i) => [r, i]).filter(([r]) => matches(r));
  if (!vis.length) { el.innerHTML = '<div class="empty">No records match.</div>'; return; }
  el.innerHTML = vis.map(([r, i]) => `
    <div class="rec${i === sel ? " sel" : ""}" data-i="${i}">
      <span class="seq">#${r.seq ?? i + 1}</span>
      <span class="kind kind-${r.kind.split(".")[0]}">${esc(r.kind)}</span>
      <span class="who">${esc(who(r))}</span>
      <span class="meta">${meta(r)}</span>
    </div>`).join("");
  el.querySelectorAll(".rec").forEach(d => d.onclick = () => { sel = +d.dataset.i; renderList(); renderDetail(); });
}
function renderDetail() {
  const r = recs[sel];
  const el = document.getElementById("detail");
  if (!r) { el.innerHTML = '<div class="empty">Select a record to inspect it.</div>'; return; }
  let head = "";
  if (r.kind === "llm.call") {
    head = `<div class="kv"><b>model</b> ${esc(r.model)} · <b>provider</b> ${esc(r.provider||"")}</div>
      <div class="kv"><b>outcome</b> ${esc(r.outcome||"")} · <b>repair_round</b> ${r.repair_round||0} · <b>cost</b> ${money(r.cost_usd||0)} · <b>tokens</b> ${(r.tokens&&r.tokens.in)||0} in / ${(r.tokens&&r.tokens.out)||0} out</div>
      <div class="kv"><b>input</b></div><pre>${esc(typeof r.input === "string" ? r.input : JSON.stringify(r.input, null, 2))}</pre>
      <div class="kv"><b>output</b></div><pre>${esc(typeof r.output === "string" ? r.output : JSON.stringify(r.output, null, 2))}</pre>`;
  } else {
    head = `<div class="kv"><b>input</b></div><pre>${esc(JSON.stringify(r.input, null, 2))}</pre>
      <div class="kv"><b>output</b></div><pre>${esc(JSON.stringify(r.output, null, 2))}</pre>`;
  }
  el.innerHTML = `<h2>${esc(r.kind)} · seq #${r.seq}</h2>${head}
    <div class="kv" style="margin-top:14px"><b>raw record</b></div>
    <pre>${esc(JSON.stringify(r, null, 2))}</pre>`;
}
document.querySelectorAll(".fbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".fbtn").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.k; renderList();
});
document.getElementById("search").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const vis = recs.map((r, i) => [r, i]).filter(([r]) => matches(r));
  if (!vis.length) return;
  const pos = vis.findIndex(([, i]) => i === sel);
  if (e.key === "j" || e.key === "ArrowDown") { sel = vis[Math.min(pos + 1, vis.length - 1)][1]; renderList(); renderDetail(); }
  if (e.key === "k" || e.key === "ArrowUp") { sel = vis[Math.max(pos - 1, 0)][1]; renderList(); renderDetail(); }
});
</script>
</body>
</html>
