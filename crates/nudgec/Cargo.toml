[package]
name = "nudgec"
version = "1.2.1"
description = "The Nudge compiler — a typed, replayable, budget-aware language for LLM agents"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nudgec"
path = "src/lib.rs"

[[bin]]
name = "nudgec"
path = "src/main.rs"

[dependencies]
nudge-runtime = { path = "../nudge-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[features]
default = ["compiler"]
compiler = []
