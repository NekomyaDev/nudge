[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudge-runtime"
version = "1.2.1"
description = "Runtime for the Nudge language — typed LLM calls, traces, replay, budgets"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["nudge_runtime*"]
