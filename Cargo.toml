[workspace]
resolver = "2"
members = ["crates/nudgec", "crates/nudge-runtime", "crates/nudge-agent"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NekomyaDev/nudge"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
